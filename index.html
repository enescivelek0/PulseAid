<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PulseAid – Dijital İlk Yardım Rehberi</title>
  <meta name="description" content="PulseAid; kanama, boğulma, yanık ve kalp krizi gibi acil durumlarda adım adım görsel, sesli ve ritmik (metronom) yönlendirme sunan, çevrimdışı çalışan ilk yardım rehberidir.">
  <meta name="keywords" content="ilk yardım, cpr, kalp masajı, heimlich manevrası, kanama durdurma, yanık, first aid, pwa">
  <meta name="author" content="Enes Civelek">
  <meta name="theme-color" content="#0f1a30">
  <link rel="canonical" href="https://pulse-aid-pearl.vercel.app/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="PulseAid – Dijital İlk Yardım Rehberi">
  <meta property="og:description" content="Acil durumlarda adım adım görsel, sesli ve ritmik ilk yardım rehberi. Çevrimdışı çalışır.">
  <meta property="og:url" content="https://pulse-aid-pearl.vercel.app/">
  <meta name="twitter:card" content="summary">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">

  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="min-h-screen min-h-[100dvh] flex flex-col selection:bg-crimson/30 selection:text-white">

  <a href="#app-container" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[60] focus:bg-crimson focus:text-white focus:px-3 focus:py-2 focus:rounded-lg">İçeriğe geç</a>

  <!-- Header -->
  <header class="sticky top-0 z-40 w-full border-b border-white/10 bg-navy/70 backdrop-blur-xl">
    <div class="max-w-6xl mx-auto px-4 h-14 sm:h-16 flex items-center justify-between gap-3">
      <a href="/" id="brand-link" class="flex items-center gap-2.5 group shrink-0" aria-label="PulseAid">
        <img src="/icon.svg" alt="" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl" width="36" height="36">
        <span class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">Pulse<span class="text-crimson">Aid</span></span>
      </a>

      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div id="gps-indicator" class="hidden md:block min-w-0"></div>
        <div class="glass-panel p-1 rounded-full flex items-center" role="group" aria-label="Dil / Language">
          <button id="lang-tr" type="button" class="px-3 py-1 rounded-full text-xs font-extrabold tracking-wider transition">TR</button>
          <button id="lang-en" type="button" class="px-3 py-1 rounded-full text-xs font-extrabold tracking-wider transition">EN</button>
        </div>
      </div>
    </div>
  </header>

  <!-- GPS (mobile) -->
  <div class="md:hidden w-full px-4 pt-3 flex justify-center">
    <div id="gps-indicator-mobile" class="max-w-full"></div>
  </div>

  <main class="flex-grow w-full py-5 sm:py-8">
    <div id="app-container" class="w-full max-w-6xl mx-auto px-4" aria-live="polite">
      <div class="flex justify-center items-center py-20">
        <div class="animate-spin rounded-full h-10 w-10 border-2 border-white/10 border-t-crimson"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full border-t border-white/5 pt-5 pb-28 sm:pb-6 bg-black/10">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-xs text-gray-400 gap-3">
      <div class="flex items-center gap-2">
        <span id="offline-dot" class="w-2 h-2 rounded-full bg-neonGreen"></span>
        <span class="font-semibold" id="offline-status">PulseAid</span>
      </div>
      <p class="text-center md:text-right" id="footer-text"></p>
    </div>
  </footer>

  <!-- Floating emergency call -->
  <a id="emergency-dialer" href="tel:112"
     class="fixed z-50 bottom-4 right-4 sm:bottom-6 sm:right-6 flex items-center gap-2 bg-crimson hover:bg-crimson-dark text-white pl-4 pr-5 py-3 sm:py-3.5 rounded-full shadow-2xl shadow-crimson/30 border border-white/20 active:scale-95 transition pulse-crimson"
     style="margin-bottom: env(safe-area-inset-bottom)">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-2.824-1.157-5.143-3.476-6.3-6.3l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/></svg>
    <span id="emergency-dialer-label" class="font-extrabold text-base tracking-wide">112 ACİL ARA</span>
  </a>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
